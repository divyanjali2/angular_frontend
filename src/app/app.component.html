<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Nature</title>
  <style>
    body {
      background-color: #e8f5e9;
      font-family: 'Arial', sans-serif;
      text-align: center;
      padding: 50px;
    }
    h1 {
      color: #2e7d32;
      font-size: 3em;
      text-transform: uppercase;
    }
    p {
      font-size: 1.5em;
      color: #388e3c;
      margin-bottom: 20px;
    }
    .button {
      padding: 15px 30px;
      background-color: #66bb6a;
      color: white;
      font-size: 1.2em;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .button:hover {
      background-color: #388e3c;
    }
    .nature-image {
      margin-top: 30px;
      width: 80%;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <h1>Welcome to Nature</h1>
  <p>Join us in protecting our environment and preserving the beauty of nature for future generations.</p>
  
  <button class="button" onclick="alert('Thank you for caring about nature!')">Learn More</button>

    <img src="https://images.app.goo.gl/MszWcg9NLvCHPW6B9" class="nature-image" alt="Nature Image">
  </div> -->
  
</body>
</html>
